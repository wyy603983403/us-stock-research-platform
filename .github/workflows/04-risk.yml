name: 04 Risk gate
on:
  pull_request:
    paths: ["src/us_stock_research/risk.py", "configs/risk/**", "research/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev]'
      - run: "grep -Eq '^trading_enabled: false$' configs/risk/default.yml"
      - run: pytest tests/test_pipeline.py -k "risk or contract"
