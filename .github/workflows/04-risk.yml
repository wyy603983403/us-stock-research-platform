name: 04 Risk gate
on:
  pull_request:
    paths: ["src/us_stock_research/risk.py", "configs/**", "research/**", "AGENTS.md", ".github/workflows/04-risk.yml", "src/us_stock_research/trading/schwab_api.py"]
  push:
    paths: ["src/us_stock_research/risk.py", "configs/**", "research/**", "AGENTS.md", ".github/workflows/04-risk.yml", "src/us_stock_research/trading/schwab_api.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk:
    # 用户 2026-10-11：GitHub 免费额度用完，改用 Mac 上的自建 runner（标签 usr，scripts/mac_install_runner.sh）。
    # 仓库变量 CI_RUNNER=github 时改回 GitHub 托管的 ubuntu-latest。
    # 公开仓库：fork 来的 PR 不在本机运行（本机有 .env 密钥和服务器 SSH 密钥）。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "usr"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # uv instead of setup-python: setup-python's macOS builds install under /Users/runner,
      # which a self-hosted Mac runner cannot write; uv keeps Python in the user's own cache
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install -e '.[dev]'
      - name: automated live trading stays off
        run: "grep -Eq '^trading_enabled: false$' configs/risk/default.yml"
      - name: manual live capital cap stays at the user's first-batch limit
        run: "grep -Eq '^max_capital_usd: 10000( |$)' configs/live.yml"
      - name: Schwab automatic orders stay off until the user decides (and records it in AGENTS.md)
        run: "grep -Eq '^orders_enabled: false( |$)' configs/schwab_api.yml"
      - run: python -m pytest -q tests/test_pipeline.py -k "risk or contract or paper or live or schwab"
