name: 01 Code quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # no pip cache: the self-hosted runner's tool-cache Python has no pip script, which made
      # setup-python's cache step fail (ENOENT .../bin/pip) on every run since the CI was added
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m ensurepip --upgrade || true
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: usr-validate-research research/*/study.yml
