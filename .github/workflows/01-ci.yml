name: 01 Code quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # 用户 2026-10-11：GitHub 免费额度用完，改用 Mac 上的自建 runner（标签 usr，scripts/mac_install_runner.sh）。
    # 仓库变量 CI_RUNNER=github 时改回 GitHub 托管的 ubuntu-latest。
    # 公开仓库：fork 来的 PR 不在本机运行（本机有 .env 密钥和服务器 SSH 密钥）。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "usr"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: usr-validate-research research/*/study.yml
      # type check is reported but not yet blocking: ~40 known findings from untyped third-party code
      - run: python -m mypy src
        continue-on-error: true
