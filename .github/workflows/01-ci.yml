name: 01 Code quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # GitHub-hosted runner (2026-10-07): the self-hosted Mac runner was offline, so CI never ran
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: usr-validate-research research/*/study.yml
      # type check is reported but not yet blocking: ~40 known findings from untyped third-party code
      - run: python -m mypy src
        continue-on-error: true
