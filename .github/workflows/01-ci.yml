name: 01 Code quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: usr-validate-research research/*/study.yml
