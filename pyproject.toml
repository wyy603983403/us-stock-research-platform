[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "us-stock-research-platform"
version = "0.1.0"
description = "Private US equity research and backtesting platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5", "types-PyYAML>=6", "duckdb>=1.1,<2", "pandas>=2", "pandas-stubs", "quantstats>=0.0.62"]
verify = ["pandas>=2"]
report = ["quantstats>=0.0.62", "pandas>=2"]
storage = ["duckdb>=1.1,<2"]
ml = ["numpy>=1.24", "lightgbm>=4"]

[project.scripts]
usr-collect-daily = "us_stock_research.collectors.yahoo_daily:main"
usr-collect-universe = "us_stock_research.collectors.universe:main"
usr-crosscheck = "us_stock_research.quality.crosscheck:main"
usr-verify-engine = "us_stock_research.research.verify_engine:main"
usr-report = "us_stock_research.research.report:main"
usr-attribution = "us_stock_research.research.attribution:main"
usr-order-intent = "us_stock_research.trading.order_intent:main"
usr-rehearsal-fill = "us_stock_research.trading.rehearsal:main"
usr-lt-intent = "us_stock_research.trading.lt_intent:main"
usr-mix-intent = "us_stock_research.trading.mix_intent:main"
usr-verify-intent = "us_stock_research.trading.verify_intent:main"
usr-review = "us_stock_research.trading.reviews:main"
usr-live = "us_stock_research.trading.live_ledger:main"
usr-paper = "us_stock_research.trading.alpaca_paper:main"
usr-status = "us_stock_research.trading.status:main"
usr-leveraged-trend = "us_stock_research.research.leveraged_trend:main"
usr-verify-lt = "us_stock_research.research.verify_lt:main"
usr-sleeve-mix = "us_stock_research.research.sleeve_mix:main"
usr-factor-sleeve = "us_stock_research.research.factor_sleeve:main"
usr-stocks = "us_stock_research.trading.stocks:main"
usr-schwab = "us_stock_research.trading.schwab_api:main"
usr-commands = "us_stock_research.trading.commands:main"
usr-ml-panel = "us_stock_research.research.ml_features:main"
usr-ml-rank = "us_stock_research.research.ml_rank:main"
usr-verify-ml = "us_stock_research.research.verify_ml:main"
usr-trend-ensemble = "us_stock_research.research.trend_ensemble:main"
usr-xsec = "us_stock_research.research.cross_section:main"
usr-build-identity = "us_stock_research.research.identity:main"
usr-xsec-validate = "us_stock_research.research.cross_section:validate_main"
usr-verify-xsec = "us_stock_research.research.verify_xsec:main"
usr-update = "us_stock_research.collectors.update:main"
usr-collect-macro = "us_stock_research.collectors.fred:main"
usr-collect-sp-dividend-yield = "us_stock_research.collectors.multpl:main"
usr-collect-fundamentals = "us_stock_research.collectors.sec_fundamentals:main"
usr-catalog = "us_stock_research.catalog:main"
usr-collect-splits = "us_stock_research.collectors.splits:main"
usr-collect-factors = "us_stock_research.collectors.factors:main"
usr-collect-sp500-history = "us_stock_research.collectors.sp500_history:main"
usr-collect-sec-bulk = "us_stock_research.collectors.sec_bulk:main"
usr-build-cik-map = "us_stock_research.collectors.cik_map:main"
usr-audit-delisted = "us_stock_research.collectors.sp500_history:audit_main"
usr-probe-intraday = "us_stock_research.collectors.tiingo_intraday:main"
usr-collect-intraday = "us_stock_research.collectors.tiingo_intraday:collect_main"
usr-collect-intraday-alpaca = "us_stock_research.collectors.alpaca_intraday:collect_main"
usr-audit-ohlcv = "us_stock_research.quality.ohlcv:main"
usr-audit-intraday = "us_stock_research.quality.intraday:main"
usr-validate-research = "us_stock_research.research.contracts:main"
usr-snapshot = "us_stock_research.research.snapshots:main"
usr-backtest = "us_stock_research.research.backtest:main"
usr-compare-brokers = "us_stock_research.research.broker_compare:main"
usr-assess-research = "us_stock_research.research.promotion:main"

[tool.setuptools.package-data]
us_stock_research = ["trading/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tools/rehearse_server.py" = ["E501"]  # embedded stub programs

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["us_stock_research"]
