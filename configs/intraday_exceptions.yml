# 分钟线已知问题（研究时剔除）。由 usr-audit-intraday 的“全市场异常日”检测得出，经人工核对。
# bad_days：该来源这一天大面积缺失或提前中断（不是个股问题）。
# symbol_start：代码被复用等原因，此日期之前的分钟线不属于同一家公司。
alpaca:
  bad_days:
    - 2021-04-19   # 约 60% 标的整天缺失，其余提前中断
    - 2021-10-25   # 约 55% 标的整天缺失
    - 2022-01-24   # 约 150 只在美东 10:42 后无数据
    - 2022-03-08   # 约 60% 标的整天缺失
    - 2024-12-23   # 全市场在美东 10:22 后无数据
    - 2025-03-10   # 几乎全部标的整天缺失
    - 2026-09-29   # 首批下载时当天尚未收盘；续传补齐后可删除此行
  symbol_start:
    SW: 2024-07-08   # Smurfit Westrock 上市日；此前 SW 分钟线属于其他证券
tiingo:
  bad_days: []
  symbol_start: {}
