# FRED 序列：编号 -> 说明（免密钥 CSV 接口）
series:
  DGS3MO: 3 个月美债收益率（无风险利率，%）
  DGS2: 2 年期美债收益率（%）
  DGS10: 10 年期美债收益率（%）
  DGS30: 30 年期美债收益率（%）
  T10Y2Y: 10 年减 2 年利差（收益率曲线倒挂指标）
  FEDFUNDS: 联邦基金有效利率（月，%）
  CPIAUCSL: 美国 CPI（月，指数）
  UNRATE: 失业率（月，%）
  INDPRO: 工业生产指数（月）
  BAMLH0A0HYM2: 高收益债信用利差（%）
  BAMLC0A0CM: 投资级公司债信用利差（%）
  DTWEXBGS: 广义美元指数（日）
  VIXCLS: VIX 波动率指数（日）
  SP500: 标普 500 指数（FRED，近十年）
  # 2026-09-29 新增
  T10YIE: 10 年期通胀预期（盈亏平衡通胀率，%）
  T5YIE: 5 年期通胀预期（%）
  DFII10: 10 年期实际利率（TIPS，%）
  ICSA: 首次申领失业金人数（周）
  NFCI: 芝加哥联储金融条件指数（周，正数偏紧）
  STLFSI4: 圣路易斯联储金融压力指数（周）
  M2SL: M2 货币供应（月）
  WALCL: 美联储资产负债表总资产（周）
  DCOILWTICO: WTI 原油现货（日）
  UMCSENT: 密歇根消费者信心（月）
  USREC: NBER 衰退标记（月，1=衰退）
