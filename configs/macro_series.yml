# FRED 序列：编号 -> 说明（免密钥 CSV 接口）
series:
  DGS3MO: 3 个月美债收益率（无风险利率，%）
  DGS2: 2 年期美债收益率（%）
  DGS10: 10 年期美债收益率（%）
  DGS30: 30 年期美债收益率（%）
  T10Y2Y: 10 年减 2 年利差（收益率曲线倒挂指标）
  FEDFUNDS: 联邦基金有效利率（月，%）
  CPIAUCSL: 美国 CPI（月，指数）
  UNRATE: 失业率（月，%）
  INDPRO: 工业生产指数（月）
  BAMLH0A0HYM2: 高收益债信用利差（%）
  BAMLC0A0CM: 投资级公司债信用利差（%）
  DTWEXBGS: 广义美元指数（日）
  VIXCLS: VIX 波动率指数（日）
  SP500: 标普 500 指数（FRED，近十年）
