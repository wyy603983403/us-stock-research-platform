  - ^VIX6M
  - ^VVIX    # VIX 的波动率
  # 美债收益率
  - ^IRX
  - ^FVX
  - ^TNX
  - ^TYX
  # 美元指数与期货
  - DX-Y.NYB
  - GC=F
  - CL=F
