name: macro_indices
description: 指数、波动率、利率与期货代码（Yahoo 无分红，复权价等于收盘价）
symbols:
  # 股指
  - ^GSPC
  - ^IXIC
  - ^DJI
  - ^RUT
  - ^NDX
  # 波动率
