order_timing: before_close                      # 2026-10-16：Alpaca 模拟盘连续 4 天让收盘单（cls）到收盘过期、0 成交，
                                                # 改为纽约 15:38 定时器（收盘前 5-25 分钟）提交市价单；原方式为 close（收盘单）
