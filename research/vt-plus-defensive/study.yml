# 预先登记（2026-10-03，在计算任何收益之前写定）。改参数 = 新版本研究。
# 背景：已批准的 sp500_trend_voltarget 收益高但回撤大（1955–2025 最大回撤 −40.8%）；ETF 趋势基线回撤小但收益低。
# 本研究问：把一半资金放进“防守趋势组合”（长债、中债、黄金，各自 200 日均线开关），整体风险收益比能否显著改善。
# 用户 2026-10-03 决定按“嘉信可买 TLT/IEF/GLD”推进（尚未在 App 中实际确认）。
schema_version: 1
kind: sleeve_mix
name: vt_plus_defensive
status: promoted              # 四项标准全部通过（2026-10-04）；用户 2026-10-04 人工批准
registered_at: 2026-10-03
question: >
  50% 已批准的标普趋势 + 波动率目标策略、50% 防守趋势组合（TLT、IEF、GLD 各 1/3，各自在 200 日均线上方时持有、
  下方时持有国库券），每月末再平衡；2005-10 至 2025-12 年的夏普比率能否显著高于单独运行已批准策略？
hypothesis: >
  国债与黄金在股票危机中常与股票走势相反或不相关（2008、2020 年初），趋势开关又能避开它们自己的长熊市
  （2013 年黄金、2022 年长债）。两部分低相关，组合后波动下降多于收益下降，夏普提高。
  主检验：组合与单独已批准策略的月度夏普之差，95% 区间下限 > 0。
data:
  aggressive_sleeve: research/sp500-trend-voltarget/study.yml   # 原样调用已批准研究的数据构造与规则（^GSPC 全收益）
  defensive_assets: [TLT, IEF, GLD]                             # 雅虎复权收盘价（含分红）
  cash_rate: DTB3
  start: 2005-10-01                       # GLD 2004-11 上市，200 日均线预热之后
  end: 2025-12-31
rule:
  aggressive_weight: 0.5
  defensive_weight: 0.5
  rebalance: 每个自然月最后一个交易日收盘后恢复 50/50，按两部分权重变化 × 10 bp 计成本
  defensive_sleeve: >
    TLT、IEF、GLD 各占防守部分 1/3，月末再平衡；每只在复权收盘价 > 200 日简单均线（含当日）时持有，否则该份额持有国库券
    （DTB3 日利率）；信号日次日收盘执行；每次开关按该份额 × 10 bp 计成本。
  aggressive_sleeve: 与 sp500_trend_voltarget 完全相同（不改任何参数）
  sma_days: 200
  execution_lag_days: 1
  trading_cost_bps: 10
benchmark:
  primary: 单独运行 sp500_trend_voltarget（同一时期）
  also_report: [标普 500 全收益, 单独的防守趋势组合]
inference:
  frequency: calendar_month
  method: paired_moving_block_bootstrap_sharpe_difference
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261007
risk:
  max_worst_12m_loss: 0.50
success_criteria:
  - 组合月度夏普 − 单独已批准策略月度夏普，95% 区间下限 > 0（配对移动块自助法）
  - 最差滚动 12 个月亏损不超过 50%
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验）
  - 独立第二实现逐月一致
reporting:                                # 只报告，不参与晋级
  weights_sensitivity: [[0.7, 0.3], [0.3, 0.7]]
  defensive_without_trend: TLT/IEF/GLD 各 1/3 一直持有（不用均线）
  years: [2008, 2013, 2020, 2022]
limitations:
  - 只有约 20 年样本（受 GLD 上市时间限制），只覆盖 2008、2020、2022 三次大回撤
  - 资产名单（长债、中债、黄金）是常识性选择，但仍是事后挑选；2000 年以后债券处于长期牛市尾段，结果可能偏乐观
  - 50/50 是整数取值，未优化；敏感性只报告
  - 成本只含固定基点，不含冲击成本与税
human_review:
  approved: true
  reviewer: 用户
  reviewed_at: 2026-10-04
  scope: 仅限不涉及真钱的阶段（路线图阶段 1 订单演练、阶段 2 模拟盘）；进入真钱阶段需另行批准
  notes: >
    四项预先登记标准全部通过（夏普差 +0.20，区间 +0.003 至 +0.40；最差 12 月 −13.6%；DSR 0.996；独立实现一致）。
    用户在知晓“年化比单独运行 sp500_trend_voltarget 低约 2.8 个百分点、证据刚过线、样本 20 年”的情况下选择本组合（选项 A），
    以本组合取代单独的 sp500_trend_voltarget 进入阶段 1 订单演练（阶段 1 的 3 个月复核从本组合首份订单清单重新计算）。
    实现：进攻部分 SPY / SSO / BIL（与已批准策略相同），防守部分 TLT / IEF / GLD / BIL；每日按研究模型（`usr-mix-intent`，
    从 --model-start 起重放）计算目标权重，仅在模型交易日（起始、敞口变化、防守开关、月末再平衡）或持仓偏离目标超过 5% 时出单。
    单一资产名义敞口沿用 2026-10-03 对 sp500_trend_voltarget 的批准（标普 500 最高 200%，本组合中最高约 100%）。

