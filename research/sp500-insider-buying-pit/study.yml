# 预先登记（2026-10-01，在计算任何收益之前写定；此前只看过“每月有内部人买入的成分股数量”这一输入统计）。
# 改参数 = 新版本研究。
schema_version: 1
kind: cross_section
name: sp500_insider_buying_pit
status: registered
registered_at: 2026-10-01
question: >
  标普 500 时点成分股中，过去 6 个月有董事或高管在公开市场买入本公司股票的，买入人数最多的前 30 只、等权、
  每月调仓，扣除成本后能否跑赢同一股票池的等权组合？
hypothesis: >
  内部人卖出原因很多（分散、纳税、流动性），买入几乎只有一个原因：认为股价低估。Lakonishok & Lee (2001)、
  Cohen, Malloy & Pomorski (2012) 发现内部人买入、尤其多人同时买入预示超额收益；但大市值股票中效应较弱，
  本研究检验它在标普 500 内是否仍然存在。主检验：相对同池等权组合月均超额收益 95% 置信区间下限 > 0。
universe:
  membership: meta/sp500_history
  prices: [daily, daily_delisted]
  start: 2012-01-01
  end: 2025-12-31
  min_history_days: 253
insider:
  source: sec_insider                     # SEC Form 3/4/5 内部人交易数据集，非衍生品交易表
  issuer: meta/ticker_cik                 # 信号日当天该代码对应的 SEC 申报主体 CIK
  known_by: filing_date <= signal_day     # 只用信号日当天或之前已提交的申报
  window_days: 182                        # (信号日 − 182 天, 信号日]
  transaction: trans_code = P 且 acquired_disposed = A 且 shares > 0 且 price > 0   # 公开市场或私下买入
  insiders: relationship 含 Director 或 Officer   # 只是 10% 大股东或 Other 的不计
signal:
  name: insider_buying
  score: >
    窗口内买入的不同内部人（owner_cik）个数 + v/(1+v)，v = 这些买入的总金额（股数 × 价格，百万美元）；
    即先比人数，人数相同比金额。窗口内没有买入的成员得 0 分。
selection:
  top_n: 30
  min_score: 0.000001                     # 只选有买入的；当月不足 30 只就只持有这些（全部为 0 则持有现金）
  weighting: equal
rebalance: monthly
execution_lag_days: 1
transaction_cost_bps: 10
delisting:
  haircut_sensitivity: -0.30
benchmarks:
  primary: equal_weight_universe          # 有价格、满一年历史的全部成员（不论有无内部人买入）
  secondary: SPY
inference:
  method: moving_block_bootstrap
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261002
success_criteria:
  - 相对等权股票池的月均超额收益，95% 置信区间下限 > 0
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验）
  - 最差滚动 12 个月亏损不超过本金的 25%
  - 价格覆盖率每个调仓日 ≥ 90%
limitations:
  - 每月有内部人买入的成分股约 100–150 只，多人买入（≥2 人）约 25–60 只，持仓数会随月份变化
  - 2012–2025 不含 2008 年那样的危机
  - 申报日最多晚于交易日 2 个工作日（2002 年后规则），个别迟报会让信号更晚而不是更早
  - 2012 年初价格覆盖率最低约 87%，与此前三项研究相同，预计不满足第 4 条
human_review:
  approved: false
