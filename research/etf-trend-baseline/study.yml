schema_version: 1
name: etf_trend_baseline
status: frozen
strategy: trend_sma_v1
question: 对主要美股与跨资产 ETF 使用 200 日均线趋势开关，能否把最差 12 个月亏损压到 25% 以内，同时长期收益不明显落后 SPY？
hypothesis: 价格在 200 日均线下方时转入短债，可以避开 2008、2022 类长熊市的大部分跌幅，代价是震荡市的来回止损。
data:
  provider: yahoo_chart
  source_url: https://query1.finance.yahoo.com/v8/finance/chart/{symbol}
  universe: [SPY, QQQ, IWM, EFA, IEF, GLD, SHY]
  start: "2005-01-01"
  end: "2025-12-31"
  snapshot_id: daily-bundle-v1:sha256:43eeb58b8611a88d00bdde5c4a438b1a1951e2c2b75efca599b931673d9d6d3a
  quality_report: artifacts/quality/etf_trend_baseline.json
parameters:
  sma_days: 200
  lookback_days: 252
  top_k: 1
  cash_symbol: SHY
  transaction_cost_bps: 5
  execution_lag_days: 1
benchmark:
  symbol: SPY
inference:
  method: moving_block_bootstrap_mean_excess_v1
  resamples: 2000
  block_size_months: 6
  confidence_level: 0.95
validation:
  method: walk_forward
  warmup_days: 252
  test_months: 12
random_seed: 42
output: artifacts/etf_trend_baseline
limitations:
  - ETF 名单是事后选定的，存在幸存者与后见之明偏差。
  - Yahoo 复权收盘价为非官方数据，分红与拆股调整可能被事后修改。
  - 成本只含固定基点，不含冲击成本、税费与借贷。
  - 月末信号、次日收盘成交是简化假设，未模拟盘中滑点。
human_review:
  required: true
  approved: false
  reviewer: null
  reviewed_at: null
