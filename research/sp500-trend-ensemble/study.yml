# 预先登记（2026-10-07，在计算任何收益之前写定）。改参数 = 新版本研究。
# 背景：运行中的组合 vt_plus_defensive 的进攻部分（sp500_trend_voltarget）只用“价格是否高于 200 日均线”一个开关，
# 震荡市里反复进出。用户 2026-10-07 认为策略过于单一，选择先研究“信号多样化”。
# 本研究只把单一开关换成 4 个常用趋势信号的等权投票，其余规则、数据、成本与已批准策略完全相同。
schema_version: 1
kind: trend_ensemble
name: sp500_trend_ensemble
status: registered
registered_at: 2026-10-07
question: >
  把标普 500 趋势 + 波动率目标策略的单一 200 日均线开关，换成 50/100/200 日均线与 12 个月超额动量 4 个信号的等权投票
  （目标敞口 = 看多票数 / 4 × min(2, 25% ÷ 20 日波动率)），1955–2025 年的夏普比率能否显著高于已批准的单一开关版本？
hypothesis: >
  不同周期的趋势信号在转折点先后翻转，投票让仓位逐步加减，而不是全进全出，可减少震荡市的来回交易损失和转折点附近的回撤
  （Hurst, Ooi & Pedersen 2017 “A Century of Evidence on Trend-Following Investing”；Levine & Pedersen 2016）。
  主检验：投票版与已批准单一开关版的月度夏普之差，配对移动块自助法 95% 区间下限 > 0。
data:
  baseline_contract: research/sp500-trend-voltarget/study.yml   # 数据构造（^GSPC + 月度股息率全收益、DTB3）与基准规则均取自它
  start: 1955-01-01
  end: 2025-12-31
rule:
  signals:
    sma_days: [50, 100, 200]          # 全收益收盘价 > 该周期简单均线（含当日）即一票
    momentum_days: 252                # 过去 252 日全收益 > 同期国库券累计收益（DTB3 日利率连乘）即一票
  exposure: 看多票数 / 4 × min(2.0, 0.25 / 20 日实际波动率)；0 票时为 0（全部国库券）
  vol_target: 0.25
  vol_window_days: 20
  max_leverage: 2.0
  rebalance_band: 0.25                # 与已批准策略相同：目标与持有敞口相差超过 0.25，或在 0 与非 0 之间切换时才调整
  execution_lag_days: 1
  trading_cost_bps: 10
  daily_return: 与 sp500_trend_voltarget 相同（E ≤ 1 时余额持国库券；E > 1 时扣国债利率 + 0.50% 融资与 0.90% 费率）
benchmark:
  primary: 已批准的 sp500_trend_voltarget（同一数据、同一时期）
  also_report: [标普 500 全收益]
inference:
  frequency: calendar_month
  method: paired_moving_block_bootstrap_sharpe_difference
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261008
risk:
  max_worst_12m_loss: 0.50
success_criteria:
  - 投票版月度夏普 − 已批准版月度夏普，95% 区间下限 > 0
  - 最差滚动 12 个月亏损不超过 50%
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验）
  - 独立第二实现逐月一致；只保留 200 日均线一票时与已批准引擎逐日一致
reporting:                            # 只报告，不参与晋级
  subperiods: [[1955-01-01, 2000-12-31], [2001-01-01, 2025-12-31]]
  variants:
    sma_only: 只用 3 条均线投票（去掉动量）
  stats: [年化, 最大回撤, 最差 12 月, 每年调整次数, 平均敞口]
limitations:
  - 均线周期与 12 个月动量是文献常用值，未在本数据上优化；但“信号多样化”这个方向是在看到组合运行后提出的
  - 已有 11 组试验，主检验门槛随试验数提高
  - 1955–2000 无杠杆 ETF，成本按今天的假设
  - 若通过，用于组合还需另一项研究（防守部分同样改为投票）或用户决定；不直接替换运行中的策略
