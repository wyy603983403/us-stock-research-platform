# 预先登记（2026-10-10，在下载卖空数据、计算任何信号值或收益之前写定；此前只查看了 2018-01-12 一份文件的表头与交易所分布，
# 并探测了免费历史文件从哪天开始）。改参数 = 新版本研究。
# 背景：用户 2026-10-10 要求继续研究个股，四个方向都做（本项为第四个：卖空/空头仓位，属于资金面）。
# 文献：Asquith, Pathak & Ritter (2005)、Boehmer, Huszar & Jordan (2010)：空头仓位低的股票随后表现更好、高的更差；
#       Hong, Li, Ni, Scheinkman & Wang (2015)：用回补天数（空头股数 ÷ 日均成交量）衡量更好。
schema_version: 1
kind: cross_section
name: sp500_short_interest
status: registered            # 已运行，未通过主检验（2026-10-10，见 docs/results/sp500-short-interest.md）
registered_at: 2026-10-10
question: >
  在标普 500 时点成分股中，每月末按最新已公布的回补天数（空头股数 ÷ 日均成交量）从低到高排序，买入最低的 30 只、等权、
  每月调仓；2018–2025 年扣除成本后能否跑赢同一股票池的等权组合？
hypothesis: >
  卖空者整体消息灵通，空头仓位低说明知情者不看空，这些股票随后表现更好。
  主检验：相对同池等权组合的月均超额收益，95% 置信区间下限 > 0。
universe:
  membership: meta/sp500_history
  prices: [daily, daily_delisted]
  start: 2018-01-01
  end: 2025-12-31
  min_history_days: 21
signal:
  name: short_interest
short_interest:
  source: FINRA 半月度空头仓位文件（https://cdn.finra.org/equity/otcmarket/biweekly/shrtYYYYMMDD.csv，含交易所上市股票，2017-12-29 起）
  fields: currentShortPositionQuantity（空头股数）、averageDailyVolumeQuantity（日均成交量）、settlementDate（结算日）、symbolCode
  days_to_cover: 空头股数 ÷ 日均成交量；日均成交量 ≤ 0 或缺失则无值
  known_by: 结算日 + 14 个自然日 ≤ 信号日（FINRA 约在结算日后 7 个工作日公布，留余量）；取满足条件的最近一个结算日
  symbol_match: FINRA 代码中的 “.” 与 “/” 换成 “-” 后与当日成员代码相同；同一结算日同一代码多行取空头股数最大的一行
  unranked: 没有回补天数的候选不参与排序，但仍在等权基准中
selection:
  top_n: 30
  order: ascending                         # 回补天数最低的 30 只
  weighting: equal
rebalance: monthly
execution_lag_days: 1
transaction_cost_bps: 10
delisting:
  haircut_sensitivity: -0.30
benchmarks:
  primary: equal_weight_universe
  secondary: SPY
inference:
  method: moving_block_bootstrap
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261013
risk:
  max_worst_12m_loss: 0.50
success_criteria:
  - 相对等权股票池的月均超额收益，95% 置信区间下限 > 0（主检验）
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验，本研究为第 18 项）
  - 最差滚动 12 个月亏损不超过 50%
  - 价格覆盖率每个调仓日 ≥ 90%；回补天数覆盖率（候选中有值的比例）每个调仓日 ≥ 90%
  - 独立第二实现逐月持仓一致
reporting:                                 # 只报告，不参与晋级
  - 相对 SPY 的年化超额与夏普
  - 回补天数最高 30 只组合的表现（空头最拥挤的是否落后）
  - 2018–2021 与 2022–2025 两段
limitations:
  - 免费历史只从 2017 年底开始，样本 8 年（约 95 个月），统计检验力低
  - FINRA 现存文件可能已含事后修订（revisionFlag），与当时首次公布的数值可能略有差异
  - 只用回补天数，不用空头占流通股比例（需要可靠的时点流通股数）
  - 已有 17 组试验，门槛随试验数提高
human_review:
  approved: false
