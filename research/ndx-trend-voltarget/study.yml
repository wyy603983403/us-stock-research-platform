# 预先登记（2026-10-03，在计算任何收益之前写定）。改参数 = 新版本研究。
# 背景：用户批准的 sp500_trend_voltarget 在标普 500 上运行。本研究把“完全相同”的规则和参数搬到纳斯达克 100，
# 不做任何针对纳指的调参。选纳指本身带有事后偏差（它是因为过去 15 年涨得好才被想到），所以样本必须包含
# 1986–2000 的上涨与 2000–2002 的 −83% 崩盘，并如实计入多重检验。
schema_version: 1
kind: leveraged_trend
name: ndx_trend_voltarget
status: registered            # 已运行，未通过主检验（2026-10-03）
registered_at: 2026-10-03
question: >
  纳斯达克 100 在 200 日均线上方时，按“目标波动率 25% ÷ 最近 20 日实际波动率”决定仓位（最高 2 倍），下方时持有国库券；
  1986–2025 年扣除融资、费率和交易成本后，能否显著跑赢持有纳斯达克 100，且最差 12 个月亏损不超过 50%？
hypothesis: >
  与 sp500_trend_voltarget 相同（Moreira & Muir 2017；Harvey et al. 2018）：趋势开关避开长熊市，波动率目标在动荡时降杠杆。
  纳指波动更高，规则会自动给出更低的平均杠杆。主检验：相对纳斯达克 100 全收益的月均超额收益 95% 置信区间下限 > 0。
data:
  signal_and_asset: ^NDX                  # 雅虎，1985-10-01 起的价格指数
  total_return: price_plus_etf_dividend_yield
  dividend_etf: QQQ                       # 股息率 = QQQ 过去 365 天现金分红 ÷ 当月最后收盘价（月末点，下月起使用）
  dividend_yield_before_etf_pct: 0.5      # QQQ 有满一年分红记录之前（1985–2000-03）假设固定 0.5%/年
  cash_rate: DTB3
  start: 1986-08-01                       # 200 日均线 + 20 日波动率需要的预热之后
  end: 2025-12-31
  validate_against: QQQ                   # 全收益构造与 QQQ 复权价比较（QQQ 含 0.20% 费率，预期构造略高）
  validate_from: 2000-04-01
  validate_to: 2025-12-31
rule:                                     # 与 sp500_trend_voltarget 完全相同
  sma_days: 200
  signal: 全收益收盘价 > 200 日简单均线（含当日）
  execution_lag_days: 1
  vol_target: 0.25
  vol_window_days: 20
  max_leverage: 2.0
  exposure: 趋势向上时 min(2.0, 0.25 / 实际波动率)；趋势向下时 0（全部国库券）
  rebalance_band: 0.25
  daily_return: >
    敞口 E ≤ 1：E × 日收益 + (1 − E) × 国债日利率；
    E > 1：E × 日收益 − (E − 1) × (国债利率 + 0.50%) / 252 − (E − 1) × 0.90% / 252
  trading_cost_bps: 10
benchmark:
  primary: 纳斯达克 100 全收益（同上构造）
inference:
  frequency: calendar_month
  method: moving_block_bootstrap
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261006
risk:
  max_worst_12m_loss: 0.50
success_criteria:
  - 相对纳斯达克 100 全收益的月均超额收益（按自然月），95% 置信区间下限 > 0
  - 最差滚动 12 个月亏损不超过 50%
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验）
  - 数据验证：2000-04 至 2025 年全收益构造与 QQQ 复权价的年化差异在 ±0.5% 以内
reporting:                                # 只报告，不参与晋级
  subperiods: [[1986-08-01, 2000-02-29], [2000-03-01, 2002-12-31], [2003-01-01, 2025-12-31]]
  sensitivity_vol_target: [0.20, 0.30]
  sensitivity_dividend_yield_before_etf_pct: [0.0, 1.0]
  compare_with: 同期标普 500 全收益与 sp500_trend_voltarget（同一规则）
limitations:
  - 选纳指有事后偏差；规则参数沿用标普版，没有针对纳指优化
  - 1985–2000 的股息率是假设值（纳指 100 当时以低分红科技股为主）；用 0% 与 1% 做敏感性
  - 杠杆 ETF 费率按 0.90%（QLD 实际 0.95%，差异 ≤ 0.05%/年 × 超出 1 倍部分），2006 年前没有 QLD，成本按今天的假设
  - 纳指 100 成分规则 1985 年以来多次修改；指数本身无幸存者偏差问题，但当年可交易性（1999 年前无 QQQ）只是假设
