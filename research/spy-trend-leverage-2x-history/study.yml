# 预先登记（2026-10-03，在计算任何收益之前写定）。改参数 = 新版本研究。
# 目的：用 2001 年以前从未参与本项目任何计算的数据，对已冻结的规则 spy_trend_leverage_2x 做样本外检验。
# 该研究在 2001–2025 年只差主检验（超额区间下限 −0.27%/月）；样本外若通过，将两项结果一并提交用户做晋级审查。
schema_version: 1
kind: leveraged_trend
name: spy_trend_leverage_2x_history
status: registered
registered_at: 2026-10-03
question: >
  与 spy_trend_leverage_2x 完全相同的规则（200 日均线、2 倍、次日收盘换仓、同样的融资/费率/切换成本），
  在 1955–2000 年的标普 500 上，收益能否显著超过持有标普 500（含分红），且最差 12 个月亏损不超过 50%？
hypothesis: 同 spy_trend_leverage_2x；本研究只换数据区间，不改任何规则参数。
data:
  signal_and_asset: ^GSPC                 # 雅虎标普 500 价格指数日线（不含分红）
  total_return: price_plus_monthly_dividend_yield
  dividend_yield: SP500_DIVYIELD          # multpl.com 月度股息率（Shiller 口径，过去 12 个月股息 / 价格）
  dividend_rule: >
    全收益指数日收益 = 当日价格涨跌 + 上一个月末已知股息率 / 252；信号和资产都用这个全收益序列（与原研究用 SPY 复权价一致）
  cash_rate: DTB3                         # FRED 3 个月国库券（二级市场贴现率），1954 年起有日数据；原研究用的 DGS3MO 1981 年才开始
  start: 1955-01-01
  end: 2000-12-31
rule:                                     # 与 research/spy-trend-leverage-2x/study.yml 逐字段相同
  sma_days: 200
  signal: 收盘价 > 200 日简单均线（含当日）
  execution_lag_days: 1
  leverage: 2.0
  leveraged_daily_return: >
    L × 日收益 − (L − 1) × (前一日 3 个月国债收益率 + 0.50%) / 252 − 0.90% / 252
  cash_daily_return: 前一日 3 个月国债收益率 / 252
  switch_cost_bps: 10
benchmark:
  primary: 标普 500 全收益（同上构造）
inference:
  frequency: calendar_month
  method: moving_block_bootstrap
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261004
risk:
  max_worst_12m_loss: 0.50
success_criteria:
  - 相对标普 500 全收益的月均超额收益（按自然月），95% 置信区间下限 > 0
  - 最差滚动 12 个月亏损不超过 50%
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验）
  - 数据验证：1994–2025 年用同样方法构造的全收益序列与 SPY 复权价的年化差异在 ±0.5% 以内（SPY 另有 0.09% 费率）
limitations:
  - 不是“盲”检验：已知文献（Gayed & Bilello 2016 用 1928–2015 年）报告过类似结论，选择这个规则本身受其影响
  - 1955–2000 年没有杠杆 ETF，融资与费率按今天的杠杆 ETF 假设；当时的实际借贷成本可能更高
  - 月度股息率平摊到每天是近似；1987-10-19 单日 −20% 之类的跳空在 2 倍下即 −40%，会如实计入
  - 雅虎 ^GSPC 早年数据只有收盘价，足够本规则使用
human_review:
  approved: false
