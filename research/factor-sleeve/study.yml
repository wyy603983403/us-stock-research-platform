# 预先登记（2026-10-07，在计算任何收益或下载因子组合数据之前写定）。改参数 = 新版本研究。
# 背景：用户 2026-10-07 问个股方向。此前 4 项标普 500 时点成分股研究（动量、低波动、质量+价值、内部人买入）均未通过
# （见 docs/results/sp500-pit-cross-section.md 等）；那些研究检验的是“选股是否跑赢同池等权”。本研究换一个问题：
# 在已批准的组合里拿出一部分资金放进“动量 + 质量”因子仓位（实盘用因子 ETF 执行），组合整体风险收益比能否改善。
# 登记时已向用户说明：作者预期通过可能性不大（自有数据中动量/质量表现平平；进攻部分本身是趋势，与动量重叠），
# 用户仍选择登记（2026-10-07 23:08 北京时间）。
schema_version: 1
kind: factor_sleeve
name: factor_sleeve_mix
status: registered
registered_at: 2026-10-07
question: >
  把已批准的 vt_plus_defensive（50% 标普趋势 + 波动率目标、50% 防守趋势）改为 40% / 40% / 20%，
  新增 20% 为“大盘动量 + 大盘高盈利”因子仓位（两者各半、一直持有、每月末再平衡），2005-10 至 2025-12 的月度夏普
  能否显著高于原组合？
hypothesis: >
  大盘股中的动量与盈利能力溢价有长期证据（Jegadeesh-Titman 1993；Novy-Marx 2013；Fama-French 2015），
  两者彼此负相关（Asness, Frazzini & Pedersen 2019 “Quality minus junk”），合成后的仓位相对市场有正的风险调整收益；
  加入组合后提高夏普。主检验：新组合与原组合的月度夏普之差，配对移动块自助法 95% 区间下限 > 0。
data:
  base_contract: research/vt-plus-defensive/study.yml     # 进攻、防守两部分的数据与规则原样调用，不改任何参数
  factor_source: >
    Kenneth French 数据库日度组合（市值加权、含分红）：
    6_Portfolios_ME_Prior_12_2_Daily_CSV.zip 的 “BIG HiPRIOR”（NYSE 中位数以上市值、过去 12-2 月涨幅前 30%），
    6_Portfolios_ME_OP_2x3_daily_CSV.zip 的 “BIG HiOP”（NYSE 中位数以上市值、营业利润率前 30%）。
    https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
  implementation_etfs: {momentum: MTUM, quality: QUAL}    # 雅虎复权收盘价；仅用于跟踪核对，不进入主检验
  cash_rate: DTB3
  start: 2005-10-01                                       # 与原组合相同（受 GLD 上市时间限制）
  end: 2025-12-31
rule:
  weights: {aggressive: 0.4, defensive: 0.4, factor: 0.2}
  factor_sleeve: >
    BIG HiPRIOR 与 BIG HiOP 各占因子仓位一半，一直持有（不加趋势开关），每个自然月最后一个交易日收盘后恢复各半。
  implementation_drag_annual: 0.005   # 因子仓位每年扣 0.50%：ETF 费率约 0.15% + 指数调仓摩擦（French 组合本身不扣成本）的假设
  rebalance: 每个自然月最后一个交易日收盘后恢复 40/40/20，按各部分权重变化 × 10 bp 计成本
  aggressive_sleeve: 与 vt_plus_defensive 中相同（即 sp500_trend_voltarget 原规则）
  defensive_sleeve: 与 vt_plus_defensive 中相同（TLT/IEF/GLD 各 1/3，各自 200 日均线开关）
  trading_cost_bps: 10
benchmark:
  primary: 已批准的 vt_plus_defensive（同一数据、同一时期）
  also_report: [标普 500 全收益, 单独的因子仓位, French 市场组合（Mkt-RF + RF）]
inference:
  frequency: calendar_month
  method: paired_moving_block_bootstrap_sharpe_difference
  block_size_months: 6
  resamples: 5000
  confidence_level: 0.95
  random_seed: 20261009
risk:
  max_worst_12m_loss: 0.50
success_criteria:
  - 新组合月度夏普 − 原组合月度夏普，95% 区间下限 > 0（配对移动块自助法）
  - 最差滚动 12 个月亏损不超过 50%
  - Deflated Sharpe ≥ 0.95（计入试验登记中的全部试验，本研究为第 13 项）
  - 独立第二实现逐月一致
  - 可执行性：MTUM、QUAL 与对应 French 组合（扣 0.50%/年后）在两只 ETF 共同存续的完整月份内，月收益相关系数均 ≥ 0.95
reporting:                                                # 只报告，不参与晋级
  variants:
    momentum_only: 因子仓位只用 BIG HiPRIOR
    quality_only: 因子仓位只用 BIG HiOP
  weights_sensitivity: [0.1, 0.3]                         # 因子仓位占比；其余两部分平分
  long_sample: 1963-07 至 2025-12 单独的因子仓位与 French 市场组合的夏普、最大回撤、最差 12 月（防守部分无数据，不做组合）
  etf_tracking: MTUM、QUAL 相对 French 组合的年化跟踪差与相对市场超额收益的相关系数
  years: [2008, 2009, 2020, 2022]                         # 2009 年为动量崩盘年
limitations:
  - 因子方向是在看过本项目 4 项个股研究结果之后提出的；参数（20%、各半、0.50% 摩擦）为整数常识取值，未优化
  - French 组合覆盖全部 NYSE/AMEX/NASDAQ 大盘股的前 30%，与 MTUM（MSCI 动量）、QUAL（MSCI 质量：ROE、杠杆、盈利波动）的选股规则不同
  - 样本约 20 年；动量崩盘（2009）只出现一次
  - 已有 12 组试验，Deflated Sharpe 门槛随试验数提高
  - 若通过，进入运行仍需用户另行批准；真钱首批（configs/live.yml）不受本研究影响
